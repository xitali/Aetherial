name: Build and release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aetherial-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build, offline regression, drivers, scan and WPF checks; stage latest package
        shell: pwsh
        run: ./scripts/release.ps1
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $metadata = Get-Content release/latest/release.json | ConvertFrom-Json
          if ('${{ github.ref_name }}' -ne "v$($metadata.version)") { throw 'Tag does not match project version.' }
          Compress-Archive -Path release/latest/* -DestinationPath Aetherial-win-x64.zip
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-package
          path: Aetherial-win-x64.zip
          retention-days: 1

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: aetherial-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-package
      - name: Publish package then remove older releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $releases = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == false) | .tag_name'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing releases.' }
          $incoming = [version]$env:RELEASE_TAG.TrimStart('v')
          foreach ($tag in $releases) {
            $parsed = $null
            if (-not [version]::TryParse($tag.TrimStart('v'), [ref]$parsed)) { throw "Unrecognized release version: $tag. Review manually." }
            if ($parsed -gt $incoming) { throw "Refusing to replace newer release $tag with $env:RELEASE_TAG" }
          }
          gh release view $env:RELEASE_TAG --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG Aetherial-win-x64.zip --clobber
          } else {
            gh release create $env:RELEASE_TAG Aetherial-win-x64.zip --title "Aetherial $env:RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed; older releases retained.' }
          gh release edit $env:RELEASE_TAG --latest
          if ($LASTEXITCODE -ne 0) { throw 'Cannot mark newest release.' }
          $releases = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == false) | .tag_name'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot list releases.' }
          foreach ($tag in $releases) {
            if ($tag -ne $env:RELEASE_TAG) {
              gh release delete $tag --yes
              if ($LASTEXITCODE -ne 0) { throw "Cannot remove old release: $tag" }
            }
          }
